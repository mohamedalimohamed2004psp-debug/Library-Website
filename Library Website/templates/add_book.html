<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة كتاب جديد</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>إضافة كتاب جديد 📚</h2>
        <form method="POST" action="/add_book">
            <label>عنوان الكتاب (Title)</label>
            <input type="text" name="title" placeholder="مثال: Hamlet" required>

            <label>السعر (Price)</label>
            <input type="number" step="0.01" name="price" placeholder="مثال: 150.00" required>

            <label>المؤلف (Author)</label>
            <select name="author_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px;">
                <option value="" disabled selected>اختر المؤلف...</option>
                {% for author in authors %}
                    <option value="{{ author.author_id }}">{{ author.name }} (ID: {{ author.author_id }})</option>
                {% endfor %}
            </select>

            <button type="submit">حفظ الكتاب</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/dashboard" style="color: #7f8c8d; text-decoration: none; font-size: 14px;">الرجوع للوحة التحكم</a>
        </div>
    </div>
</body>
</html>
