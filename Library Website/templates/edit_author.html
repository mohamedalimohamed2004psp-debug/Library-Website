<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات مؤلف</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>تعديل بيانات المؤلف ✏️</h2>
        <form method="POST" action="/edit_author/{{ author.author_id }}">
            <label>اسم المؤلف (Name)</label>
            <input type="text" name="name" value="{{ author.name }}" required>

            <label>الدولة (Country)</label>
            <input type="text" name="country" value="{{ author.country }}" required>

            <button type="submit">تحديث البيانات</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/dashboard" style="color: #7f8c8d; text-decoration: none; font-size: 14px;">إلغاء والرجوع</a>
        </div>
    </div>
</body>
</html>
