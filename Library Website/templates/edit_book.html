<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات كتاب</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>تعديل بيانات الكتاب ✏️</h2>
        <form method="POST" action="/edit_book/{{ book.book_id }}">
            <label>عنوان الكتاب (Title)</label>
            <input type="text" name="title" value="{{ book.title }}" required>

            <label>السعر (Price)</label>
            <input type="number" step="0.01" name="price" value="{{ book.price }}" required>

            <label>المؤلف (Author)</label>
            <select name="author_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px;">
                {% for author in authors %}
                    <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>
                        {{ author.name }} (ID: {{ author.author_id }})
                    </option>
                {% endfor %}
            </select>

            <button type="submit">تحديث بيانات الكتاب</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/dashboard" style="color: #7f8c8d; text-decoration: none; font-size: 14px;">إلغاء والرجوع</a>
        </div>
    </div>
</body>
</html>
